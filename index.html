<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>INVYTRA — Learn. Create. Celebrate.</title>
    <meta
      name="description"
      content="Invytra is the parent company behind Invytra Learning, Invytra Projects and Invytra Events — learn, create and celebrate under one brand."
    />
    <meta
      name="keywords"
      content="Invytra, Invytra Learning, Invytra Projects, Invytra Events, online learning, college projects, final year projects, events and celebrations"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://invytra.com/" />
    <meta name="theme-color" content="#1a1815" />
    <meta name="color-scheme" content="light" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="INVYTRA" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INVYTRA — Learn. Create. Celebrate." />
    <meta
      property="og:description"
      content="Invytra is the parent company behind Invytra Learning, Invytra Projects and Invytra Events — learn, create and celebrate under one brand."
    />
    <meta property="og:url" content="https://invytra.com/" />
    <meta property="og:image" content="https://invytra.com/assets/images/og/cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Abstract Invytra ecosystem artwork" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INVYTRA — Learn. Create. Celebrate." />
    <meta
      name="twitter:description"
      content="Invytra is the parent company behind Invytra Learning, Invytra Projects and Invytra Events — learn, create and celebrate under one brand."
    />
    <meta name="twitter:image" content="https://invytra.com/assets/images/og/cover.jpg" />

    <!-- Prevent white flash / set brand bg before hydration -->
    <style>
      html {
        background: #f6f1e8;
      }
      /* Self-contained boot screen: styled before any external CSS/JS arrives. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1a1815;
        color: #f6f1e8;
        font-family: Georgia, "Times New Roman", serif;
      }
      #boot .boot-mark { font-size: 42px; line-height: 1; }
      #boot .boot-mark b { color: #b3873e; font-weight: 600; }
      #boot .boot-word { letter-spacing: 0.42em; font-size: 20px; text-indent: 0.42em; }
      #boot .boot-bar { width: 220px; height: 1px; background: rgba(246,241,232,0.15); overflow: hidden; }
      #boot .boot-bar i { display: block; height: 100%; width: 100%; background: #b3873e; transform-origin: left; animation: bootbar 1.1s ease-in-out infinite; }
      @keyframes bootbar { 0% { transform: scaleX(0); } 55% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">I<b>V</b></div>
      <div class="boot-word">INVYTRA</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: sans-serif; color: #101116">
        Invytra is a technology and creative ecosystem building digital products, learning
        experiences and new ventures. Please enable JavaScript to view this site.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
